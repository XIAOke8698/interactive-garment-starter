<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="沉浸式单件材质展示：拖拽转向、指针锚定缩放、三档光位与面料微距。">
  <meta name="theme-color" content="#e3e3dd">
  <title>Garment study · 001</title>
  <link rel="stylesheet" href="src/stage.css">
  <script type="module" src="src/stage-app.js"></script>
</head>
<body class="loading">
  <a class="skip" href="#info-bar">跳到商品信息</a>

  <main class="stage">
    <canvas id="stage-canvas" aria-label="可拖拽的服装转台" role="img"></canvas>
    <div class="detail-layer" id="detail-layer" aria-hidden="false"></div>

    <header class="top-bar">
      <span class="brand" data-brand>Garment</span>
      <span class="kicker" id="stage-kicker">Material study</span>
      <div class="light-switch" role="group" aria-label="光位">
        <button type="button" data-light="front" aria-pressed="true" title="顺光（1）">顺光</button>
        <button type="button" data-light="side" aria-pressed="false" title="侧光（2）">侧光</button>
        <button type="button" data-light="back" aria-pressed="false" title="逆光（3）">逆光</button>
      </div>
    </header>

    <footer class="info-bar" id="info-bar">
      <div class="identity">
        <span class="eyebrow" id="material-label">皮革</span>
        <h1 id="garment-name">—</h1>
        <p class="type-line" id="garment-type"></p>
      </div>
      <dl class="spec" id="spec-list"></dl>
      <p class="hints">拖拽转向 · 滚轮缩放 · 点击圆点看细节 · 双击复位</p>
    </footer>

    <aside class="detail-panel" id="detail-panel" aria-hidden="true" aria-labelledby="detail-title">
      <div class="detail-head">
        <h2 id="detail-title">细节</h2>
        <button type="button" id="detail-close" aria-label="关闭细节面板">关闭 ×</button>
      </div>
      <img id="detail-image" alt="" width="320" height="232">
      <p id="detail-note"></p>
      <p class="source-note" id="detail-source"></p>
    </aside>

    <div class="fallback" id="stage-fallback" hidden>
      <p class="eyebrow">无法启用材质渲染</p>
      <p id="stage-fallback-message"></p>
      <p class="fallback-links">你的浏览器不支持 WebGL2。可以改用 <a href="rack.html">挂杆浏览版</a>，或换用支持 WebGL2 的浏览器。</p>
    </div>

    <p class="live" id="live" aria-live="polite"></p>
  </main>
</body>
</html>
